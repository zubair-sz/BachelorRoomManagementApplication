# Run the whole app with NO PostgreSQL installed. Data is kept in backend/data/brm.mv.db
# and survives restarts. Start it with:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# Good for trying the app out. Use PostgreSQL (the default) for anything real.
spring:
  datasource:
    url: jdbc:h2:file:./data/brm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
