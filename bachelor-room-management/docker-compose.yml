version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brm_db
      POSTGRES_USER: brm_user
      POSTGRES_PASSWORD: brm_password
    ports:
      - "5432:5432"
    volumes:
      - brm_pgdata:/var/lib/postgresql/data

volumes:
  brm_pgdata:
